services:
  - type: web
    name: astra-ai-ecosystem
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: yes
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUTF8
        value: "1"
      - key: OFFLINE_MODE
        value: "True"
      - key: ENABLE_DB_MIGRATIONS
        value: "False"
      - key: ENABLE_VERSION_UPDATE_CHECK
        value: "False"
      - key: ENABLE_ADMIN_ANALYTICS
        value: "False"
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      - key: POSTHOG_DISABLED
        value: "1"
      - key: DO_NOT_TRACK
        value: "1"
      - key: WEBUI_SECRET_KEY
        generateValue: true
      - key: OLLAMA_BASE_URL
        value: "http://127.0.0.1:11434"
      - key: DEFAULT_MODELS
        value: "astra"
      - key: FROM_INIT_PY
        value: "true"
      - key: ENABLE_IMAGE_GENERATION
        value: "True"
      - key: IMAGE_GENERATION_ENGINE
        value: "openai"
      - key: IMAGES_OPENAI_API_BASE_URL
        value: "http://127.0.0.1:8892/v1"
      - key: IMAGES_OPENAI_API_KEY
        value: "astra"
      - key: IMAGE_GENERATION_MODEL
        value: "dreamshaper-8"
      - key: RAG_EMBEDDING_ENGINE
        value: ""
      - key: AUDIO_STT_ENGINE
        value: ""
      - key: AUDIO_TTS_ENGINE
        value: ""
      - key: ENABLE_WEB_SEARCH
        value: "False"
      - key: ENABLE_MEMORIES
        value: "False"
